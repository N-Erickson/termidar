version: 2

project_name: termidar

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: termidar
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: N-Erickson
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/N-Erickson/termidar"
    description: "Real-time weather radar in your terminal"
    license: "MIT"
    install: |
      bin.install "termidar"
    test: |
      system bin/"termidar", "--version"

nfpms:
  - package_name: termidar
    homepage: "https://github.com/N-Erickson/termidar"
    description: "Real-time weather radar in your terminal"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
    maintainer: "N-Erickson"
