version: 2

project_name: termidar

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: termidar
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    exclude:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: N-Erickson
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/N-Erickson/termidar"
    description: "Real-time weather radar in your terminal"
    license: "MIT"
    install: |
      bin.install "termidar"
    test: |
      assert_match version.to_s, shell_output("#{bin}/termidar --version 2>&1", 1)

nfpms:
  - package_name: termidar
    homepage: "https://github.com/N-Erickson/termidar"
    description: "Real-time weather radar in your terminal"
    license: "MIT"
    formats:
      - deb
      - rpm
      - apk
    maintainer: "N-Erickson"

snapcrafts:
  - name: termidar
    summary: "Real-time weather radar in your terminal"
    description: |
      Termidar displays animated NEXRAD weather radar data directly in your
      terminal. Enter a US ZIP code and watch real-time precipitation patterns
      with color-coded intensity, geographic overlays, forecasts, and more.
    grade: stable
    confinement: strict
    license: MIT
    apps:
      termidar:
        command: termidar
        plugs:
          - network
